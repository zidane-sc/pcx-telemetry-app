allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://storage.googleapis.com/download.flutter.io'
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    afterEvaluate { p ->
        if (p.hasProperty("android")) {
            def androidExt = p.extensions.findByName("android")
            if (androidExt != null && androidExt.hasProperty("namespace")) {
                if (androidExt.namespace == null || androidExt.namespace.isEmpty()) {
                    if (p.name == "flutter_bluetooth_serial") {
                        androidExt.namespace = "io.github.edufolly.flutterbluetoothserial"
                    } else if (p.name == "flutter_overlay_window") {
                        androidExt.namespace = "flutter.overlay.window.flutter_overlay_window"
                    } else if (p.name == "flutter_tts") {
                        androidExt.namespace = "com.tundralabs.fluttertts"
                    } else {
                        def groupStr = p.group?.toString()?.trim()
                        if (groupStr == null || groupStr.isEmpty() || groupStr == "unspecified") {
                            androidExt.namespace = "com.zidane.${p.name.replace('-', '_')}"
                        } else {
                            androidExt.namespace = groupStr
                        }
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
