allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://storage.googleapis.com/download.flutter.io'
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.plugins.withId("com.android.library") {
        if (project.android.hasProperty("namespace")) {
            if (project.android.namespace == null || project.android.namespace.isEmpty()) {
                if (project.name == "flutter_bluetooth_serial") {
                    project.android.namespace = "io.github.edufolly.flutterbluetoothserial"
                } else {
                    def groupStr = project.group?.toString()?.trim()
                    if (groupStr == null || groupStr.isEmpty() || groupStr == "unspecified") {
                        project.android.namespace = "com.zidane.${project.name.replace('-', '_')}"
                    } else {
                        project.android.namespace = groupStr
                    }
                }
            }
        }
    }
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
