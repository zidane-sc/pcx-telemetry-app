allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://storage.googleapis.com/download.flutter.io'
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
            project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 34
                buildToolsVersion "34.0.0"
                if (namespace == null) {
                    if (project.name == "flutter_bluetooth_serial") {
                        namespace = "io.github.edufolly.flutterbluetoothserial"
                    } else if (project.name == "flutter_overlay_window") {
                        namespace = "flutter.overlay.window.flutter_overlay_window"
                    } else if (project.name == "flutter_tts") {
                        namespace = "com.tundralabs.fluttertts"
                    } else {
                        namespace = "com.zidane.${project.name.replace('-', '_')}"
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
