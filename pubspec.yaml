name: pcx_telemetry_app
description: Smart Telemetry & IoT Diagnostic Cluster for Honda PCX 160
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pocketbase: ^0.20.0
  flutter_bluetooth_serial: ^0.4.0
  geolocator: ^12.0.0
  sensors_plus: ^6.0.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  wakelock_plus: ^1.2.0
  google_fonts: ^6.2.0
  fl_chart: ^0.68.0

dependency_overrides:
  geolocator_android: 4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
